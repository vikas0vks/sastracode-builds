<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090E1C"/>
      <stop offset="0.55" stop-color="#101736"/>
      <stop offset="1" stop-color="#1B1040"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(430 150) rotate(0) scale(420)">
      <stop stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1150 40) rotate(0) scale(340)">
      <stop stop-color="#A78BFA" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#7C93D4" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#dots)"/>
  <rect width="1280" height="300" fill="url(#glowC)"/>
  <rect width="1280" height="300" fill="url(#glowV)"/>

  <!-- terminal window, right side -->
  <g>
    <rect x="760" y="58" width="448" height="186" rx="14" fill="#0B1220"/>
    <rect x="760" y="58" width="448" height="38" rx="14" fill="#151F38"/>
    <circle cx="784" cy="77" r="6" fill="#FF5F57"/>
    <circle cx="806" cy="77" r="6" fill="#FEBC2E"/>
    <circle cx="828" cy="77" r="6" fill="#28C840"/>
    <text x="970" y="84" font-family="Consolas, monospace" font-size="16" fill="#8FA3D9" text-anchor="middle">sastracode</text>
    <g font-family="Consolas, monospace">
      <text x="786" y="126" font-size="17" fill="#C792EA">$ </text>
      <text x="812" y="126" font-size="17" fill="#82AAFF">sastra</text>
      <text x="866" y="126" font-size="17" fill="#C792EA">"add dark mode"</text>
      <text x="812" y="154" font-size="17" fill="#89DDFF">reading AgentScreen.kt ...</text>
      <text x="812" y="182" font-size="17" fill="#89DDFF">editing 3 files</text>
      <text x="786" y="212" font-size="17" fill="#C792EA">✓ </text>
      <text x="806" y="212" font-size="17" fill="#C3E88D">done in 18.4s</text>
    </g>
  </g>

  <!-- left content -->
  <g font-family="Consolas, monospace">
    <text x="72" y="92" font-size="20" fill="#64748B">// builds for android 8+</text>
  </g>
  <text x="66" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="88" font-weight="800" fill="url(#wordmark)">SastraCode</text>
  <text x="72" y="220" font-family="Consolas, monospace" font-size="23" fill="#B9C7E6">coding assistant for Android</text>

  <g>
    <rect x="72" y="242" width="252" height="34" rx="17" fill="#22D3EE" fill-opacity="0.12"/>
    <rect x="72" y="242" width="252" height="34" rx="17" stroke="#22D3EE" stroke-opacity="0.45"/>
    <text x="88" y="264" font-family="Consolas, monospace" font-size="18" fill="#67E8F9">download: latest release</text>
  </g>
</svg>
